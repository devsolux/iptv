# IPTV / com.devsolux.iptv
# Release packaging for the committed, verified dependency graph.
#
# Policy:
# - Every job installs exactly what the repository pins: .node-version, rust-toolchain.toml,
#   package-lock.json and src-tauri/Cargo.lock. Nothing is resolved or upgraded in CI; a
#   missing or stale lock fails `node scripts/project.mjs release` instead of producing a
#   different build. Dependency upgrades are a deliberate `make bootstrap` commit.
# - Actions are pinned to the commit of their latest stable release (checked 2026-10-16).
# - Runner images are pinned (ubuntu-24.04, macos-15, windows-2025) so system packages stay known.
# - Tauri remains on major 2 and generates the Android host; AGP, Kotlin and Gradle versions
#   come from it. The runner provides Temurin JDK 21, the LTS accepted by current AGP/Gradle.
#
# Signing:
# - Cosign uses GitHub OIDC: NO COSIGN_PRIVATE_KEY or long-lived PAT is needed.
# - Optional Android installation signing uses four repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Supply all four or none.
# - Without them, Android outputs are explicitly named "unsigned" and are NOT
#   installable. Cosign does not replace APK signing, Apple Developer ID /
#   notarization, Windows Authenticode, or Tauri updater signatures.
# - macOS packages are ad-hoc signed, not notarized; Windows has no Authenticode.
#
# workflow_dispatch builds/signs Actions artifacts only. release:published also
# uploads assets to that existing release; it never creates a release or tag.
# Published IMMUTABLE releases cannot accept new assets. They fail preflight;
# use dispatch for artifacts, or a draft-before-publication workflow instead.
# Public Sigstore records expose the workflow identity and artifact digests.

name: Release IPTV

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: iptv-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  prepare:
    name: Validate identity, pins and the release target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      release_id: ${{ steps.identity.outputs.release_id }}
      cosign: ${{ steps.cosign.outputs.version }}
    steps:
      - name: Check out the triggering commit, never the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enforce exact pins and committed lockfiles
        run: node scripts/project.mjs release

      - name: Validate identity, release tag and publication policy
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('.')
          pkg = json.loads((root / 'package.json').read_text())
          app = json.loads((root / 'src-tauri/tauri.conf.json').read_text())
          if (pkg['name'], pkg['version'], app['productName'], app['version'], app['identifier']) != (
              'iptv', '1.0.0', 'IPTV', '1.0.0', 'com.devsolux.iptv'
          ):
              raise SystemExit('Unexpected IPTV identity or version; update release metadata deliberately.')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if commit != os.environ['GITHUB_SHA']:
              raise SystemExit('The checkout does not match the triggering commit.')
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          tag, release_id = '', ''
          if os.environ['GITHUB_EVENT_NAME'] == 'release':
              release_id = str(int(event['release']['id']))
              api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/{release_id}"
              request = urllib.request.Request(api, headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              tag = release['tag_name']
              if tag not in (pkg['version'], f"v{pkg['version']}") or os.environ['GITHUB_REF'] != f'refs/tags/{tag}':
                  raise SystemExit('Release tag must match package.json: 1.0.0 or v1.0.0.')
              if release['draft'] or release.get('immutable', False):
                  raise SystemExit('Cannot append assets to a draft/immutable published release. Use workflow_dispatch for build artifacts.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in dict(commit=commit, version=pkg['version'], tag=tag, release_id=release_id).items():
                  output.write(f'{key}={value}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## IPTV {pkg['version']}\nCommit: `{commit}`\n\n")
              summary.write('Built from the committed lockfiles, `.node-version` and `rust-toolchain.toml`.\n')
          PY

      - name: Resolve current stable Cosign, not the installer's older default
        id: cosign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          request = urllib.request.Request('https://api.github.com/repos/sigstore/cosign/releases/latest', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          version = release['tag_name']
          if release['draft'] or release['prerelease'] or not re.fullmatch(r'v3\.\d+\.\d+', version):
              raise SystemExit('Review the Cosign signing interface before adopting a new major/prerelease.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  verify:
    name: Verify the committed application before packaging
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf file rpm xdg-utils
      - name: Install the pinned toolchain and the committed dependency graph
        run: |
          set -euo pipefail
          rustup toolchain install
          node scripts/project.mjs release
          npm ci
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Run the project checks, SQL/tooling suites and browser tests
        run: |
          set -euo pipefail
          make build-web
          make check
          make test-sql test-tools
          npm exec -- playwright install --with-deps chromium
          make test-e2e

  desktop:
    name: Build ${{ matrix.platform }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - os: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-15
            platform: macos-universal
            target: universal-apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf file rpm xdg-utils
      - name: Ensure the Windows MSI build prerequisite is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capability = Get-WindowsCapability -Online -Name 'VBSCRIPT*' | Select-Object -First 1
          if ($capability -and $capability.State -ne 'Installed') {
            $result = Add-WindowsCapability -Online -Name $capability.Name
            if ($result.RestartNeeded) { throw 'VBScript installation requires a runner restart.' }
          }
      - name: Install the pinned toolchain and the committed dependency graph
        run: |
          set -euo pipefail
          rustup toolchain install
          node scripts/project.mjs release
          npm ci
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native installers through the existing Tauri entry point
        env:
          TARGET: ${{ matrix.target }}
          RUST_TARGETS: ${{ matrix.targets }}
          BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$RUST_TARGETS"
          rustup target add "${targets[@]}"
          # Tauri invokes beforeBuildCommand; do not build the frontend twice.
          npm run tauri -- build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked

      - name: Collect only the expected release packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess
          root = pathlib.Path('src-tauri/target') / os.environ['TARGET'] / 'release/bundle'
          out = pathlib.Path('release-assets')
          out.mkdir(exist_ok=True)
          prefix = f"IPTV-{os.environ['VERSION']}-{os.environ['PLATFORM']}"
          layouts = {
              'linux-x86_64': [('appimage/*.AppImage', '.AppImage'), ('deb/*.deb', '.deb'), ('rpm/*.rpm', '.rpm')],
              'windows-x86_64': [('nsis/*.exe', '-setup.exe'), ('msi/*.msi', '.msi')],
              'macos-universal': [('dmg/*.dmg', '.dmg')],
          }
          for pattern, suffix in layouts[os.environ['PLATFORM']]:
              files = list(root.glob(pattern))
              if len(files) != 1 or not files[0].is_file() or files[0].is_symlink():
                  raise SystemExit(f'Expected exactly one regular package for {pattern}: {files}')
              shutil.copyfile(files[0], out / (prefix + suffix))
          if os.environ['PLATFORM'] == 'macos-universal':
              apps = list((root / 'macos').glob('*.app'))
              if len(apps) != 1:
                  raise SystemExit('Expected exactly one macOS application bundle.')
              binary = apps[0] / 'Contents/MacOS/iptv'
              # lipo -archs prints the slices; -verify_arch parses its arguments
              # differently across Xcode releases, so the check happens here.
              archs = set(subprocess.run(['lipo', '-archs', str(binary)], check=True, capture_output=True, text=True).stdout.split())
              if archs != {'arm64', 'x86_64'}:
                  raise SystemExit(f'Expected a universal arm64+x86_64 binary, found slices: {sorted(archs)}')
              subprocess.run(['tar', '-czf', str(out / (prefix + '.app.tar.gz')), '-C', str(apps[0].parent), apps[0].name], check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          # Replace only this job's temporary artifact when retrying a build.
          overwrite: true
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  android:
    name: Build Android / Fire OS ${{ matrix.arch }}
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            target: armv7-linux-androideabi
            abi: armeabi-v7a
          - arch: aarch64
            target: aarch64-linux-android
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Temurin JDK 21 (the LTS accepted by the generated AGP/Gradle host)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned toolchain and the committed dependency graph
        run: |
          set -euo pipefail
          rustup toolchain install
          node scripts/project.mjs release
          npm ci
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Install the latest stable Android NDK and build tools
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?The GitHub-hosted Ubuntu runner must provide the Android SDK}"
          # The runner's own command-line tools stay in place: reinstalling
          # cmdline-tools;latest lands in a second directory that sdkmanager then flags.
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --licenses < <(yes) > /dev/null
          "$manager" --channel=0 'platform-tools'
          "$manager" --list --channel=0 > "$RUNNER_TEMP/sdk-packages.txt"
          python - <<'PY'
          import os, pathlib, re, subprocess
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          listing = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'sdk-packages.txt').read_text()
          versions = lambda prefix: sorted(set(re.findall(r'^\s*' + prefix + r';(\d+\.\d+\.\d+)\s*\|', listing, re.M)), key=lambda x: tuple(map(int, x.split('.'))))
          ndks, tools = versions('ndk'), versions('build-tools')
          if not ndks or not tools:
              raise SystemExit('Unable to resolve stable Android NDK and build-tools packages.')
          manager = str(sdk / 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager, '--channel=0', f'ndk;{ndks[-1]}', f'build-tools;{tools[-1]}'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'NDK_HOME={sdk / "ndk" / ndks[-1]}\n')
              env.write(f'ANDROID_NDK_HOME={sdk / "ndk" / ndks[-1]}\n')
              env.write(f'ANDROID_BUILD_TOOLS={sdk / "build-tools" / tools[-1]}\n')
          PY
      - name: Generate the Android host and apply the existing TV configuration
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$RUST_TARGET"
          if [[ ! -f src-tauri/gen/android/app/build.gradle.kts ]]; then
            npm run tauri -- android init --ci
          fi
          node scripts/android-configure.mjs
          node scripts/android-configure.mjs --check
          # Install the SDK platforms actually referenced by the generated host and plugin.
          python - <<'PY'
          import os, pathlib, re, subprocess
          files = [pathlib.Path('src-tauri/gen/android/app/build.gradle.kts'), pathlib.Path('src-tauri/plugins/player/android/build.gradle.kts')]
          levels = set()
          for path in files:
              matches = re.findall(r'\bcompileSdk\s*=\s*(\d+)', path.read_text())
              if len(matches) != 1:
                  raise SystemExit(f'Review the changed compileSdk declaration in {path}.')
              levels.add(int(matches[0]))
          listing = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'sdk-packages.txt').read_text()
          available = set(re.findall(r'^\s*(platforms;android-\d+(?:\.\d+)?)\s*\|', listing, re.M))
          packages = []
          for level in sorted(levels):
              # From API 37 Google publishes stable platforms as minor revisions
              # (platforms;android-37.0); the Android Gradle plugin resolves
              # compileSdk = 37 to that .0 platform, so there is no plain android-37.
              found = [name for name in (f'platforms;android-{level}', f'platforms;android-{level}.0') if name in available]
              if not found:
                  raise SystemExit(f'No stable SDK platform publishes API level {level}: {sorted(available)}')
              packages.append(found[0])
          manager = pathlib.Path(os.environ['ANDROID_HOME']) / 'cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([str(manager), '--channel=0', *packages], check=True)
          PY
      - name: Build release APK and AAB using Tauri's Android runner
        env:
          ANDROID_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          npm run tauri -- android build --ci --target "$ANDROID_ARCH" --apk --aab -- --locked

      - name: Collect ABI-verified Android packages and optionally sign for installation
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_ARCH: ${{ matrix.arch }}
          EXPECTED_ABI: ${{ matrix.abi }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os, pathlib, re, shutil, subprocess, tempfile, zipfile
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          present = [bool(os.environ.get(name)) for name in names]
          if any(present) and not all(present):
              raise SystemExit('Supply all four Android signing secrets or none; refusing partial configuration.')
          signing = all(present)
          root = pathlib.Path('src-tauri/gen/android/app/build/outputs')
          out = pathlib.Path('release-assets')
          out.mkdir(exist_ok=True)
          prefix = f"IPTV-{os.environ['VERSION']}-android-{os.environ['ANDROID_ARCH']}"
          tools = pathlib.Path(os.environ['ANDROID_BUILD_TOOLS'])
          with tempfile.TemporaryDirectory(prefix='iptv-sign-', dir=os.environ['RUNNER_TEMP']) as temporary:
              temporary = pathlib.Path(temporary)
              keystore = temporary / 'release.jks'
              if signing:
                  keystore.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True))
                  keystore.chmod(0o600)
              for extension in ['apk', 'aab']:
                  candidates = [p for p in root.rglob(f'*.{extension}') if 'release' in str(p).lower() and not p.is_symlink()]
                  if len(candidates) != 1:
                      raise SystemExit(f'Expected one release {extension}, found {len(candidates)}.')
                  source = candidates[0]
                  with zipfile.ZipFile(source) as archive:
                      abis = {m.group(1) for n in archive.namelist() if (m := re.match(r'(?:base/)?lib/([^/]+)/[^/]+\.so$', n))}
                  if abis != {os.environ['EXPECTED_ABI']}:
                      raise SystemExit(f'Wrong native ABIs in {source.name}: {abis}')
                  destination = out / f'{prefix}{"" if signing else "-unsigned"}.{extension}'
                  if not signing:
                      shutil.copyfile(source, destination)
                      continue
                  if extension == 'apk':
                      aligned = temporary / 'aligned.apk'
                      subprocess.run([str(tools / 'zipalign'), '-P', '16', '-f', '4', str(source), str(aligned)], check=True)
                      subprocess.run([
                          str(tools / 'apksigner'), 'sign', '--v4-signing-enabled', 'false', '--ks', str(keystore),
                          '--ks-key-alias', os.environ['ANDROID_KEY_ALIAS'],
                          '--ks-pass', 'env:ANDROID_KEYSTORE_PASSWORD', '--key-pass', 'env:ANDROID_KEY_PASSWORD',
                          '--out', str(destination), str(aligned),
                      ], check=True)
                      subprocess.run([str(tools / 'apksigner'), 'verify', '--verbose', str(destination)], check=True)
                      subprocess.run([str(tools / 'zipalign'), '-c', '-P', '16', '4', str(destination)], check=True)
                  else:
                      shutil.copyfile(source, destination)
                      subprocess.run([
                          'jarsigner', '-keystore', str(keystore), '-storepass:env', 'ANDROID_KEYSTORE_PASSWORD',
                          '-keypass:env', 'ANDROID_KEY_PASSWORD', str(destination), os.environ['ANDROID_KEY_ALIAS'],
                      ], check=True)
                      # Android upload certificates are commonly self-signed: verify integrity,
                      # without treating an intentionally absent public CA chain as a failure.
                      result = subprocess.run(['jarsigner', '-verify', str(destination)], check=True, capture_output=True, text=True, env={**os.environ, 'JAVA_TOOL_OPTIONS': '-Duser.language=en -Duser.country=US'})
                      if 'jar verified.' not in result.stdout:
                          raise SystemExit('AAB signature verification did not confirm a signed archive.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Android {os.environ['ANDROID_ARCH']}: {'installation-signed' if signing else 'UNSIGNED; not installable'} APK/AAB.\n\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-android-${{ matrix.arch }}
          overwrite: true
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  sign:
    name: Keyless Sigstore signing and verification
    needs: [prepare, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # No source checkout, npm install, or execution of downloaded build outputs
      # in this privileged job. Same-run artifacts do not need actions: write.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: incoming
          merge-multiple: false
      - name: Assemble the complete platform set
        run: |
          python - <<'PY'
          import os, pathlib, re, shutil
          incoming, out = pathlib.Path('incoming'), pathlib.Path('release-assets')
          expected = {f"packages-{name}" for name in [
              'linux-x86_64', 'windows-x86_64', 'macos-universal', 'android-armv7', 'android-aarch64',
          ]}
          if {p.name for p in incoming.iterdir()} != expected:
              raise SystemExit('Missing or unexpected platform artifacts; refusing an incomplete release.')
          out.mkdir()
          for directory in sorted(incoming.iterdir()):
              count = 0
              for source in sorted(directory.iterdir()):
                  if not source.is_file() or source.is_symlink() or not re.fullmatch(r'IPTV-[A-Za-z0-9._-]+', source.name):
                      raise SystemExit('Unexpected artifact type or unsafe filename.')
                  target = out / source.name
                  if target.exists() or source.stat().st_size == 0:
                      raise SystemExit('Duplicate or empty release artifact.')
                  shutil.copyfile(source, target)
                  count += 1
              if count != (3 if 'linux-x86_64' in directory.name else 2):
                  raise SystemExit(f'Unexpected package count in {directory.name}.')
          PY
      - name: Install the resolved latest stable Cosign with installer verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ needs.prepare.outputs.cosign }}
      - name: Sign every asset and its checksum manifest; verify exact workflow identity
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign version
          cd release-assets
          # Snapshot the input set BEFORE creating any .sigstore.json bundles.
          mapfile -d '' assets < <(find . -maxdepth 1 -type f -name 'IPTV-*' -printf '%f\0' | LC_ALL=C sort -z)
          ((${#assets[@]} == 11)) || { echo 'Expected 11 platform packages.' >&2; exit 1; }
          sha256sum -- "${assets[@]}" > SHA256SUMS
          for asset in "${assets[@]}" SHA256SUMS; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$asset"
          done
          sha256sum --check --strict SHA256SUMS
          {
            printf '## Signature verification\n\n'
            printf 'Identity: `%s`\n\n' "$CERTIFICATE_IDENTITY"
            printf 'Issuer: `https://token.actions.githubusercontent.com`\n\n'
            printf 'Every package and SHA256SUMS has a verified Sigstore bundle bound to this workflow and commit.\n'
            printf 'These signatures do not grant operating-system trust or certify runtime compatibility.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the signed release set for both trigger types
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IPTV-${{ needs.prepare.outputs.version }}-signed-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Attach verified assets to the published GitHub Release
    if: github.event_name == 'release'
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Only this job can write release assets. It has no OIDC permission,
      # Android secrets, source checkout, or application build commands.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact }}
          path: release-assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ needs.prepare.outputs.cosign }}
      - name: Reverify the complete signed release set before upload
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cd release-assets
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          while read -r digest asset; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ && "$asset" =~ ^IPTV-[A-Za-z0-9._-]+$ ]] || exit 1
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$asset"
          done < SHA256SUMS
      - name: Upload without overwriting existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.parse, urllib.request
          api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/{int(os.environ['RELEASE_ID'])}"
          headers = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                  return json.load(response)
          release = get(api)
          if release['draft'] or release.get('immutable', False) or release['tag_name'] != os.environ['RELEASE_TAG']:
              raise SystemExit('Release changed or is immutable; assets remain in the Actions artifact.')
          tag_ref = urllib.parse.quote('refs/tags/' + os.environ['RELEASE_TAG'], safe='')
          commit_api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{tag_ref}"
          if get(commit_api)['sha'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('Release tag moved after the build; refusing to attach mismatched packages.')
          root = pathlib.Path('release-assets')
          checksums = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  (IPTV-[A-Za-z0-9._-]+)', line)
              if not match or match[2] in checksums:
                  raise SystemExit('Malformed or duplicate checksum manifest entry.')
              checksums[match[2]] = match[1]
          allowed = set(checksums) | {name + '.sigstore.json' for name in checksums} | {'SHA256SUMS', 'SHA256SUMS.sigstore.json'}
          if len(checksums) != 11 or {p.name for p in root.iterdir()} != allowed:
              raise SystemExit('The release file set does not match the signed checksum manifest.')
          files = sorted(root.iterdir())
          if any(not p.is_file() or p.is_symlink() or not 0 < p.stat().st_size < 2 * 1024**3 for p in files):
              raise SystemExit('Unexpected file type or GitHub release asset size.')
          existing = {}
          page = 1
          while True:
              assets = get(f'{api}/assets?per_page=100&page={page}')
              for asset in assets:
                  if asset['name'] in existing:
                      raise SystemExit('Duplicate release asset names; review the release before retrying.')
                  existing[asset['name']] = asset
              if len(assets) < 100:
                  break
              page += 1
          digests, pending = {}, []
          for path in files:
              with path.open('rb') as stream:
                  digests[path.name] = hashlib.file_digest(stream, 'sha256').hexdigest()
              previous = existing.get(path.name)
              if previous:
                  if (previous.get('state'), previous.get('size'), previous.get('digest')) != (
                      'uploaded', path.stat().st_size, 'sha256:' + digests[path.name]
                  ):
                      raise SystemExit(f'Refusing to overwrite a different/unverifiable asset: {path.name}. Signed outputs remain in Actions.')
                  print(f'Already uploaded and identical: {path.name}')
              else:
                  pending.append(path)
          upload = release['upload_url'].split('{', 1)[0]
          parsed = urllib.parse.urlsplit(upload)
          if parsed.scheme != 'https' or parsed.hostname != 'uploads.github.com':
              raise SystemExit('Unexpected upload host; this workflow targets GitHub.com.')
          for path in pending:
              with path.open('rb') as stream:
                  digest = digests[path.name]
                  request = urllib.request.Request(
                      upload + '?' + urllib.parse.urlencode({'name': path.name}), data=stream, method='POST',
                      headers={**headers, 'Content-Type': 'application/octet-stream', 'Content-Length': str(path.stat().st_size)},
                  )
                  with urllib.request.urlopen(request, timeout=600) as response:
                      asset = json.load(response)
              if asset.get('state') != 'uploaded' or asset.get('size') != path.stat().st_size:
                  raise SystemExit(f'Upload confirmation failed: {path.name}')
              if asset.get('digest') and asset['digest'] != f'sha256:{digest}':
                  raise SystemExit(f'GitHub asset digest mismatch: {path.name}')
              print(f'Uploaded {path.name}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Uploaded {len(pending)} files; confirmed all {len(files)} verified files on release `{os.environ['RELEASE_TAG']}`.\n")
          PY
