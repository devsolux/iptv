[package]
name = "iptv"
version = "1.0.0"
description = "IPTV desktop and Android application"
authors = ["Baris Aydin"]
edition = "2024"
publish = false

[lib]
name = "iptv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/iptv-core", "plugins/player"]
resolver = "3"

[workspace.dependencies]
tauri = { version = "=2.12.3" }
tauri-build = { version = "=2.7.2" }
tauri-plugin = { version = "=2.7.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking", "stream", "cookies"] }
quick-xml = "=0.42.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "v5", "serde"] }
thiserror = "=2.0.21"
axum = "=0.8.9"
futures-util = "=0.3.34"
chacha20poly1305 = "=0.11.0"
getrandom = "=0.4.3"
zeroize = { version = "=1.9.1", features = ["derive"] }
flate2 = "=1.1.10"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iptv-core = { path = "crates/iptv-core" }
tauri-plugin-iptv-player = { path = "plugins/player" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
